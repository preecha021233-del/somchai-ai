name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Build owner-signed release APK when signing secrets are configured
        env:
          SOMCHAI_SIGNING_KEYSTORE_BASE64: ${{ secrets.SOMCHAI_SIGNING_KEYSTORE_BASE64 }}
          SOMCHAI_SIGNING_STORE_PASSWORD: ${{ secrets.SOMCHAI_SIGNING_STORE_PASSWORD }}
          SOMCHAI_SIGNING_KEY_ALIAS: ${{ secrets.SOMCHAI_SIGNING_KEY_ALIAS }}
          SOMCHAI_SIGNING_KEY_PASSWORD: ${{ secrets.SOMCHAI_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SOMCHAI_SIGNING_KEYSTORE_BASE64" ] && [ -n "$SOMCHAI_SIGNING_STORE_PASSWORD" ] && [ -n "$SOMCHAI_SIGNING_KEY_ALIAS" ] && [ -n "$SOMCHAI_SIGNING_KEY_PASSWORD" ]; then
            echo "$SOMCHAI_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/somchai-release.jks"
            export SOMCHAI_SIGNING_KEYSTORE="$RUNNER_TEMP/somchai-release.jks"
            gradle assembleRelease
          else
            echo "::warning::Owner signing secrets are not configured; no update-capable release APK was produced."
          fi
      - name: Verify package identity, version increment and signing certificate continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.somchai.ai'"
          NEW_VERSION=$("$AAPT" dump badging "$APK" | sed -n "1s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
          test -n "$NEW_VERSION"
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh run download 45004339173 --repo "$GITHUB_REPOSITORY" --name somchai-owner-signed-release-apk --dir "$RUNNER_TEMP/previous-release"
          OLD_APK=$(find "$RUNNER_TEMP/previous-release" -name '*.apk' -print -quit)
          test -n "$OLD_APK"
          "$AAPT" dump badging "$OLD_APK" | grep -F "package: name='com.somchai.ai'"
          OLD_VERSION=$("$AAPT" dump badging "$OLD_APK" | sed -n "1s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
          test -n "$OLD_VERSION"
          test "$NEW_VERSION" -gt "$OLD_VERSION"
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')
          test -n "$NEW_CERT"
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          echo "Package ID, increasing versionCode and owner signing certificate continuity verified."
      - uses: actions/upload-artifact@v4
        with:
          name: somchai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload owner-signed release APK when present
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: somchai-owner-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
