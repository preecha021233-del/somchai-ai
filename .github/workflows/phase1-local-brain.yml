name: Phase 1 Local Brain

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "docs/LOCAL_BRAIN_RUNTIME.md"
      - ".github/workflows/phase1-local-brain.yml"
  push:
    branches: [phase-1/local-brain-runtime]
    paths:
      - "app/**"
      - ".github/workflows/phase1-local-brain.yml"

permissions:
  contents: read

jobs:
  android-local-brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;29.0.13113456 cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM tests and build ARM64 APK with native llama.cpp
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-local-brain-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
