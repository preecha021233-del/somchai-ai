name: Phase 1 Local Brain

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, phase-1/research-reader-brain-integration]
    paths:
      - "app/**"
      - "docs/LOCAL_BRAIN_RUNTIME.md"
      - ".github/workflows/phase1-local-brain.yml"
  push:
    branches: [phase-1/local-brain-runtime]
    paths:
      - "app/**"
      - ".github/workflows/phase1-local-brain.yml"

concurrency:
  group: phase1-local-brain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-local-brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;29.0.13113456 cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM unit tests independently
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Cache pinned llama.cpp FetchContent source
        uses: actions/cache@v4
        with:
          path: app/.cxx/cmake/debug/arm64-v8a/_deps
          key: llama-cpp-8d60873dfb8619f2b5ed31adfbab07cccb40db5c-ndk29-cmake3316
          restore-keys: |
            llama-cpp-8d60873dfb8619f2b5ed31adfbab07cccb40db5c-

      - name: Build ARM64 native runtime and Android APKs
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-local-brain-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
