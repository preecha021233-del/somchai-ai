name: Phase 1 Local Brain

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, phase-1/research-reader-brain-integration]
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "docs/LOCAL_BRAIN_RUNTIME.md"
      - ".github/workflows/phase1-local-brain.yml"
  push:
    branches: [phase-1/local-brain-runtime]
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "docs/TESTING/**"
      - "docs/LOCAL_BRAIN_RUNTIME.md"
      - ".github/workflows/phase1-local-brain.yml"

concurrency:
  group: phase1-local-brain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-local-brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;29.0.13113456 cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM unit tests independently
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Cache pinned llama.cpp FetchContent source
        uses: actions/cache@v4
        with:
          path: app/.cxx/cmake/debug/arm64-v8a/_deps
          key: llama-cpp-8d60873dfb8619f2b5ed31adfbab07cccb40db5c-ndk29-cmake3316
          restore-keys: |
            llama-cpp-8d60873dfb8619f2b5ed31adfbab07cccb40db5c-

      - name: Build ARM64 native runtime and Android APKs
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-local-brain-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  owner-signed-release:
    # Release APKs are built only from an explicit manual run, never from PR code.
    if: github.event_name == 'workflow_dispatch'
    needs: android-local-brain
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOMCHAI_SIGNING_KEYSTORE: ${{ github.workspace }}/somchai-release.jks
      SOMCHAI_SIGNING_STORE_PASSWORD: ${{ secrets.SOMCHAI_SIGNING_STORE_PASSWORD }}
      SOMCHAI_SIGNING_KEY_ALIAS: ${{ secrets.SOMCHAI_SIGNING_KEY_ALIAS }}
      SOMCHAI_SIGNING_KEY_PASSWORD: ${{ secrets.SOMCHAI_SIGNING_KEY_PASSWORD }}
      SOMCHAI_SIGNING_CERT_SHA256: ${{ secrets.SOMCHAI_SIGNING_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;29.0.13113456 cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore owner signing keystore
        env:
          SOMCHAI_SIGNING_KEYSTORE_BASE64: ${{ secrets.SOMCHAI_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SOMCHAI_SIGNING_KEYSTORE_BASE64 SOMCHAI_SIGNING_STORE_PASSWORD SOMCHAI_SIGNING_KEY_ALIAS SOMCHAI_SIGNING_KEY_PASSWORD SOMCHAI_SIGNING_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          printf '%s' "$SOMCHAI_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SOMCHAI_SIGNING_KEYSTORE"
          chmod 600 "$SOMCHAI_SIGNING_KEYSTORE"
          test -s "$SOMCHAI_SIGNING_KEYSTORE"

      - name: Build owner-signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify package, version and owner signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          APP_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          if [ "$APP_ID" != "com.somchai.ai" ]; then
            echo "::error::Wrong application ID: $APP_ID"
            exit 1
          fi
          if [ "$VERSION_CODE" != "11" ]; then
            echo "::error::Unexpected versionCode: $VERSION_CODE (expected 11)"
            exit 1
          fi
          SIGNING_OUTPUT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          ACTUAL_CERT="$(printf '%s\n' "$SIGNING_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="$(printf '%s' "$SOMCHAI_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL_CERT" ] || [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Release certificate SHA-256 does not match the owner-pinned certificate."
            exit 1
          fi
          echo "Verified applicationId=$APP_ID versionCode=$VERSION_CODE and owner certificate SHA-256."

      - name: Upload owner-signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-owner-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
