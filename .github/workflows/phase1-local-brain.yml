name: Phase 1 Local Brain

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, phase-1/research-reader-brain-integration]
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "docs/LOCAL_BRAIN_RUNTIME.md"
      - ".github/workflows/phase1-local-brain.yml"
  push:
    branches: [phase-1/local-brain-runtime]
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "docs/TESTING/**"
      - "docs/LOCAL_BRAIN_RUNTIME.md"
      - ".github/workflows/phase1-local-brain.yml"

concurrency:
  group: phase1-local-brain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  android-local-brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;29.0.13113456 cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM unit tests independently
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Cache pinned llama.cpp FetchContent source
        uses: actions/cache@v4
        with:
          path: app/.cxx/cmake/debug/arm64-v8a/_deps
          key: llama-cpp-8d60873dfb8619f2b5ed31adfbab07cccb40db5c-ndk29-cmake3316
          restore-keys: |
            llama-cpp-8d60873dfb8619f2b5ed31adfbab07cccb40db5c-

      - name: Build ARM64 native runtime and Android APKs
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-local-brain-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  owner-signed-release:
    # Reuse the existing owner signing secrets and verification flow used by Android CI.
    # Build a release automatically after successful branch pushes; never on PR code.
    if: github.event_name != 'pull_request'
    needs: android-local-brain
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOMCHAI_SIGNING_STORE_PASSWORD: ${{ secrets.SOMCHAI_SIGNING_STORE_PASSWORD }}
      SOMCHAI_SIGNING_KEY_ALIAS: ${{ secrets.SOMCHAI_SIGNING_KEY_ALIAS }}
      SOMCHAI_SIGNING_KEY_PASSWORD: ${{ secrets.SOMCHAI_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;29.0.13113456 cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore existing owner signing keystore
        env:
          SOMCHAI_SIGNING_KEYSTORE_BASE64: ${{ secrets.SOMCHAI_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SOMCHAI_SIGNING_KEYSTORE_BASE64 SOMCHAI_SIGNING_STORE_PASSWORD SOMCHAI_SIGNING_KEY_ALIAS SOMCHAI_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Existing Android CI signing secret is missing: $name"
              exit 1
            fi
          done
          printf '%s' "$SOMCHAI_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/somchai-release.jks"
          chmod 600 "$RUNNER_TEMP/somchai-release.jks"
          test -s "$RUNNER_TEMP/somchai-release.jks"
          echo "SOMCHAI_SIGNING_KEYSTORE=$RUNNER_TEMP/somchai-release.jks" >> "$GITHUB_ENV"

      - name: Build owner-signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify package, increasing version and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.somchai.ai'"
          NEW_VERSION=$("$AAPT" dump badging "$APK" | sed -n "1s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
          test -n "$NEW_VERSION"
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh run download 45017522494 --repo "$GITHUB_REPOSITORY" --name somchai-owner-signed-release-apk --dir "$RUNNER_TEMP/previous-release"
          OLD_APK=$(find "$RUNNER_TEMP/previous-release" -name '*.apk' -print -quit)
          test -n "$OLD_APK"
          "$AAPT" dump badging "$OLD_APK" | grep -F "package: name='com.somchai.ai'"
          OLD_VERSION=$("$AAPT" dump badging "$OLD_APK" | sed -n "1s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
          test -n "$OLD_VERSION"
          test "$NEW_VERSION" -gt "$OLD_VERSION"
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')
          test -n "$NEW_CERT"
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          echo "Verified applicationId, increasing versionCode and same owner signing certificate."

      - name: Upload owner-signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: somchai-owner-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
